name: marrai-backend

services:
  api:
    build: .
    image: marrai-backend:local
    container_name: marrai-api
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    image: marrai-backend:local
    container_name: marrai-worker
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=${WORKER_CONCURRENCY_LIMIT:-2}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: marrai-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: marrai-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-aeo_audit}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-aeo_audit}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - marrai_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  migrator:
    build: .
    image: marrai-backend:local
    container_name: marrai-migrator
    command: alembic upgrade head
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  marrai_postgres_data: